name: Publish firmware installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp index.html app.js styles.css _site/
          cp firmware/manifest-c6.json firmware/manifest-s3.json firmware/manifest-s3-143c.json _site/firmware/
          for part in .firmware-c6/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-c6.factory.bin
          for part in .firmware-s3/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3.factory.bin
          for part in .firmware-s3-143c/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3-143c.factory.bin
          cd _site/firmware
          echo "907e54e4b533a11d042f2724d5ef85208b0e3bf6f3c2719255b758399b751811  firmware-c6.factory.bin" | sha256sum --check
          echo "76e3c16ca2f318e1fd261a4ab48c1577980287ab387ebcd3b2188be2f180bd75  firmware-s3.factory.bin" | sha256sum --check
          echo "7e75f13835a1360030d2e33eaa729737edfea9410c9b3ffd34531fa5d86d52ce  firmware-s3-143c.factory.bin" | sha256sum --check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

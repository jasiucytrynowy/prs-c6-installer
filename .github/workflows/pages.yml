name: Publish firmware installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp index.html app.js styles.css _site/
          cp firmware/manifest-c6.json firmware/manifest-s3.json firmware/manifest-s3-143c.json _site/firmware/
          for part in .firmware-c6/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-c6.factory.bin
          for part in .firmware-s3/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3.factory.bin
          for part in .firmware-s3-143c/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3-143c.factory.bin
          cd _site/firmware
          echo "e682664304b974ff09f2c191d4b9d53b4a42cf6198f0fbac4bde33a3f9d568af  firmware-c6.factory.bin" | sha256sum --check
          echo "73f6671d0ab8a11312dcb94c2ab298cf33ccf820513f256c6a01687753e11648  firmware-s3.factory.bin" | sha256sum --check
          echo "83d77c177b583ffc05659e5fefc00ca886790967fe43d24d02002d621e4fdc65  firmware-s3-143c.factory.bin" | sha256sum --check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

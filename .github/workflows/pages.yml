name: Publish firmware installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp index.html app.js styles.css _site/
          cp firmware/manifest-c6.json firmware/manifest-s3.json firmware/manifest-s3-143c.json _site/firmware/
          for part in .firmware-c6/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-c6.factory.bin
          for part in .firmware-s3/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3.factory.bin
          for part in .firmware-s3-143c/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3-143c.factory.bin
          cd _site/firmware
          echo "7c7a842a1916c2482431573223cb57e12cee5725e87fae2de84315776aea9f22  firmware-c6.factory.bin" | sha256sum --check
          echo "1e88c57ff4fa1624b80724af2fdd268e8576a6d486f56a3b2e2180f476dc1044  firmware-s3.factory.bin" | sha256sum --check
          echo "8245669881198a732e81e63cd89d217cc1edc250685e88b51035b1b5ccc6161a  firmware-s3-143c.factory.bin" | sha256sum --check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

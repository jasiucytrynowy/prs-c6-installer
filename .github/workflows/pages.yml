name: Publish firmware installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp index.html app.js styles.css _site/
          cp firmware/manifest-c6.json firmware/manifest-s3.json firmware/manifest-s3-143c.json _site/firmware/
          for part in .firmware-c6/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-c6.factory.bin
          for part in .firmware-s3/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3.factory.bin
          for part in .firmware-s3-143c/part-*.b64; do base64 --decode "$part"; done > _site/firmware/firmware-s3-143c.factory.bin
          cd _site/firmware
          echo "e0929dd41b32cb549e3abc341fe81dd4d52304c12c63891b60effdca0bd7ca52  firmware-c6.factory.bin" | sha256sum --check
          echo "74d68f6634fd14bebab33c2bc44f435391af99c44196e0cc97f4e7f0d9cac98a  firmware-s3.factory.bin" | sha256sum --check
          echo "4a790f5ef5d122e8b181cb2047cbe343d0b3c7e582e15e1274d3b224eb6e9178  firmware-s3-143c.factory.bin" | sha256sum --check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

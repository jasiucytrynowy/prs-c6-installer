name: Publish firmware installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site/firmware
          cp index.html app.js styles.css _site/
          cp firmware/manifest.json _site/firmware/
          cat .firmware/part-*.b64 | base64 --decode > _site/firmware/firmware.factory.bin
          test -s _site/firmware/firmware.factory.bin

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages deployment is triggered on every main-branch update.
